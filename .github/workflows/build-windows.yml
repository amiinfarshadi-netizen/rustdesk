name: BeeNet Windows Build

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build:
    runs-on: windows-2022

    env:
      RENDEZVOUS_SERVER: "5.202.90.37"
      RS_PUB_KEY: "urwMFu4fL6ov3jSaG+KZoduD6OdSp3sstm6iwiaWDGw="
      RUST_BACKTRACE: "full"
      VCPKG_ROOT: "C:\\vcpkg"
      VCPKG_DEFAULT_TRIPLET: "x64-windows-static"
      CLANG_X64_PATH: "C:\\Program Files\\LLVM\\bin"
      LIBCLANG_PATH: "C:\\Program Files\\LLVM\\bin"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Setup and Install vcpkg Dependencies
        shell: pwsh
        run: |
          echo "VCPKG_ROOT=C:\vcpkg" >> $env:GITHUB_ENV
          & "C:\vcpkg\vcpkg.exe" install opus libvpx aom ffmpeg --triplet x64-windows-static

      - name: Install flutter_rust_bridge_codegen
        shell: pwsh
        run: |
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --locked

      - name: Patch Configuration
        shell: pwsh
        run: |
          if (Test-Path Cargo.toml) {
            (Get-Content Cargo.toml) -replace 'default-run\s*=', '# default-run =' | Set-Content Cargo.toml
          }
          if (Test-Path build.py) {
            (Get-Content build.py) -replace '--locked', '' | Set-Content build.py
          }

      - name: Run Build Script
        shell: pwsh
        run: |
          python -u build.py --flutter 2>&1 | Tee-Object -FilePath "build-full.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beenet-windows-binaries
          path: |
            build-full.log
            flutter/build/windows/x64/runner/Release/**
            target/release/*.exe
            target/release/*.dll
          if-no-files-found: ignore

name: Build BeeNet Desk Windows

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022

    env:
      RENDEZVOUS_SERVER: "5.202.90.37"
      RS_PUB_KEY: "urwMFu4fL6ov3jSaG+KZoduD6OdSp3sstm6iwiaWDGw="
      RUST_BACKTRACE: "full"
      CLANG_X64_PATH: "C:\\Program Files\\LLVM\\bin"
      LIBCLANG_PATH: "C:\\Program Files\\LLVM\\bin"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Patch Configuration
        shell: pwsh
        run: |
          # 1. Patch Cargo.toml
          if (Test-Path Cargo.toml) {
            (Get-Content Cargo.toml) -replace 'default-run\s*=', '# default-run =' | Set-Content Cargo.toml
            Write-Host "Patched Cargo.toml successfully."
          }

          # 2. Remove --locked from build.py
          if (Test-Path build.py) {
            (Get-Content build.py) -replace '--locked', '' | Set-Content build.py
            Write-Host "Removed --locked flag from build.py successfully."
          }

      - name: Run Build Script
        shell: pwsh
        run: |
          python build.py --flutter --hwcodec 2>&1 | Tee-Object -FilePath "build-full.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beenet-windows-binaries
          path: |
            build-full.log
            build/windows/runner/Release/
            target/release/*.exe
            target/release/*.dll
          if-no-files-found: ignore

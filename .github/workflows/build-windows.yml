name: BeeNet Windows Build

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Windows Client
    runs-on: windows-2022

    defaults:
      run:
        shell: pwsh

    env:
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: full
      VCPKG_DEFAULT_TRIPLET: x64-windows-static

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Ensure Submodules are Initialized
        run: |
          git submodule update --init --recursive
          if ($LASTEXITCODE -ne 0) {
            throw "Submodule initialization failed."
          }

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.19.6"
          cache: true

      - name: Pin and Verify MSVC Tools
        run: |
          $ErrorActionPreference = "Stop"

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path -LiteralPath $vswhere)) {
            throw "vswhere.exe was not found."
          }

          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) {
            throw "MSVC installation path not found."
          }

          $versionFile = Join-Path $vsPath "VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt"
          if (-not (Test-Path -LiteralPath $versionFile)) {
            throw "Microsoft.VCToolsVersion.default.txt not found."
          }

          $msvcVersion = (Get-Content -LiteralPath $versionFile).Trim()
          $msvcBin = Join-Path $vsPath "VC\Tools\MSVC\$msvcVersion\bin\Hostx64\x64"
          $linker = Join-Path $msvcBin "link.exe"

          foreach ($tool in @($linker, (Join-Path $msvcBin "cl.exe"), (Join-Path $msvcBin "lib.exe"))) {
            if (-not (Test-Path -LiteralPath $tool)) {
              throw "MSVC tool not found: $tool"
            }
          }

          $msvcBin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

          @(
            "MSVC_BIN=$msvcBin"
            "MSVC_LINK_EXE=$linker"
            "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$linker"
          ) | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          $env:PATH = "$msvcBin;$env:PATH"
          Write-Host "Selected MSVC linker: $linker"

      - name: Configure Flutter for Windows Desktop
        run: |
          flutter config --enable-windows-desktop
          flutter doctor -v

      - name: Setup LLVM and Clang for bindgen
        run: |
          $ErrorActionPreference = "Stop"

          $llvmHome = "C:\Program Files\LLVM"
          $llvmBin = Join-Path $llvmHome "bin"
          $libclang = Join-Path $llvmBin "libclang.dll"

          if (-not (Test-Path -LiteralPath $libclang)) {
            throw "libclang.dll not found: $libclang"
          }

          @(
            "LIBCLANG_PATH=$llvmBin"
            "LLVM_HOME=$llvmHome"
          ) | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          $llvmBin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          $env:MSVC_BIN | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Setup vcpkg and Build Dependencies
        run: |
          $ErrorActionPreference = "Stop"
          $env:PATH = "$env:MSVC_BIN;$env:PATH"

          $vcpkgRoot = "C:\vcpkg"
          if ($env:VCPKG_INSTALLATION_ROOT -and (Test-Path -LiteralPath $env:VCPKG_INSTALLATION_ROOT)) {
            $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          }

          $vcpkgExe = Join-Path $vcpkgRoot "vcpkg.exe"
          $env:VCPKG_ROOT = $vcpkgRoot
          Set-Location $vcpkgRoot

          & $vcpkgExe integrate install
          if ($LASTEXITCODE -ne 0) { throw "vcpkg integrate install failed." }

          $packages = @(
            "libvpx:x64-windows",
            "libvpx:x64-windows-static",
            "libyuv:x64-windows",
            "libyuv:x64-windows-static",
            "opus:x64-windows",
            "opus:x64-windows-static",
            "aom:x64-windows",
            "aom:x64-windows-static",
            "ffmpeg[core,avcodec,avformat,swscale,swresample]:x64-windows",
            "ffmpeg[core,avcodec,avformat,swscale,swresample]:x64-windows-static"
          )

          & $vcpkgExe install @packages --recurse
          if ($LASTEXITCODE -ne 0) { throw "vcpkg dependency installation failed." }

          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Provide Diagnostic MFX Stubs
        working-directory: ${{ github.workspace }}
        run: |
          $ErrorActionPreference = "Stop"
          $env:PATH = "$env:MSVC_BIN;$env:PATH"

          $stubDir = Join-Path $env:GITHUB_WORKSPACE "native-stubs"
          New-Item -ItemType Directory -Force -Path $stubDir | Out-Null

          $source = Join-Path $stubDir "mfx_stub.c"
          $object = Join-Path $stubDir "mfx_stub.obj"
          $libmfx = Join-Path $stubDir "libmfx.lib"
          $mfx = Join-Path $stubDir "mfx.lib"

          @'
          void MFXInit(void) {}
          void MFXClose(void) {}
          '@ | Set-Content -LiteralPath $source -Encoding ascii

          & "$env:MSVC_BIN\cl.exe" /nologo /c /MD $source "/Fo$object"
          & "$env:MSVC_BIN\lib.exe" /nologo "/OUT:$libmfx" $object
          Copy-Item -LiteralPath $libmfx -Destination $mfx -Force

          $destinations = @(
            $env:GITHUB_WORKSPACE,
            (Join-Path $env:GITHUB_WORKSPACE "target\debug"),
            (Join-Path $env:GITHUB_WORKSPACE "target\release")
          )

          foreach ($destination in $destinations) {
            New-Item -ItemType Directory -Force -Path $destination | Out-Null
            Copy-Item -LiteralPath $libmfx -Destination $destination -Force
            Copy-Item -LiteralPath $mfx -Destination $destination -Force
          }

          "MFX_STUB_DIR=$stubDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Prepare Flutter Packages
        working-directory: ${{ github.workspace }}
        run: |
          if (Test-Path -LiteralPath "flutter\pubspec.yaml") {
            Set-Location "flutter"
          }
          flutter pub get

      - name: Install Flutter Rust Bridge Codegen
        working-directory: ${{ github.workspace }}
        run: |
          $env:PATH = "$env:MSVC_BIN;$env:PATH"
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --locked -vv

      - name: Run Flutter Rust Bridge Codegen
        working-directory: ${{ github.workspace }}
        run: |
          $env:PATH = "$env:MSVC_BIN;$env:PATH"
          $root = $env:GITHUB_WORKSPACE
          $candidates = @(
            (Join-Path $root "rust\src\api.rs"),
            (Join-Path $root "src\api.rs"),
            (Join-Path $root "src\flutter_ffi.rs")
          )
          $rustInput = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1

          if ($rustInput) {
            $flutterDir = if (Test-Path -LiteralPath (Join-Path $root "flutter\pubspec.yaml")) { Join-Path $root "flutter" } else { $root }
            Set-Location $flutterDir
            $dartOutput = Join-Path $flutterDir "lib\generated_bridge.dart"
            flutter_rust_bridge_codegen --rust-input $rustInput --dart-output $dartOutput
            
            # ایجاد نسخه با هر دو نام جهت اطمینان از سازگاری کامل importها
            $altOutput = Join-Path $flutterDir "lib\bridge_generated.dart"
            if (Test-Path -LiteralPath $dartOutput) {
              Copy-Item -LiteralPath $dartOutput -Destination $altOutput -Force
            }
          }

      - name: Prepare build.py for Diagnostic Build
        working-directory: ${{ github.workspace }}
        run: |
          $ErrorActionPreference = "Stop"

          @'
          from pathlib import Path
          import re

          path = Path("build.py")
          if not path.is_file():
              raise SystemExit("ERROR: build.py not found")

          original = path.read_text(encoding="utf-8")
          pattern = r'\bcargo build\b[^\r\n\'"]*'

          matches = list(re.finditer(pattern, original))
          if not matches:
              print("No direct 'cargo build' matches to patch in build.py.")
          else:
              def patch_command(match):
                  command = match.group(0)
                  command = re.sub(r'(?<!\S)--locked\b', '', command)
                  if not re.search(r'(?<!\S)-vv\b', command):
                      command = command.replace("cargo build", "cargo build -vv", 1)
                  return command

              updated = re.sub(pattern, patch_command, original)
              path.write_text(updated, encoding="utf-8")
              print(f"Prepared {len(matches)} cargo build command(s) in build.py.")
          '@ | python -

      - name: Pre-fetch Dependencies and Patch FFmpeg Profile Constants
        working-directory: ${{ github.workspace }}
        run: |
          $ErrorActionPreference = "Stop"
          $env:PATH = "$env:MSVC_BIN;$env:PATH"

          cargo fetch
          if ($LASTEXITCODE -ne 0) { throw "cargo fetch failed." }

          @'
          import os
          from pathlib import Path

          cargo_home = Path(os.environ.get("CARGO_HOME", str(Path.home() / ".cargo")))
          checkouts = cargo_home / "git" / "checkouts"

          if not checkouts.is_dir():
              print(f"Cargo checkouts directory does not exist yet: {checkouts}")
          else:
              files = set()
              for root in checkouts.glob("*hwcodec*"):
                  for path in root.rglob("*"):
                      if (
                          path.is_file()
                          and "cpp" in path.parts
                          and path.suffix.lower() in {".cpp", ".h", ".hpp", ".cc"}
                      ):
                          files.add(path)

              patched = 0
              constants = {
                  "FF_PROFILE_H264_HIGH": "100",
                  "FF_PROFILE_HEVC_MAIN": "1",
              }

              for path in sorted(files):
                  content = path.read_text(encoding="utf-8")
                  updated = content
                  for old_const, new_val in constants.items():
                      if old_const in updated:
                          updated = updated.replace(old_const, new_val)
                  if updated != content:
                      path.write_text(updated, encoding="utf-8")
                      patched += 1

              print(f"Inspected {len(files)} files; patched {patched} files for FFmpeg constants.")
          '@ | python -

      - name: Run Build Script
        working-directory: ${{ github.workspace }}
        env:
          RENDEZVOUS_SERVER: "5.202.90.37"
          RS_PUB_KEY: ${{ secrets.RS_PUB_KEY }}
          CFLAGS: "/MD"
          CXXFLAGS: "/MD"
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false
          $env:PATH = "$env:MSVC_BIN;$env:PATH"

          $staticRoot = Join-Path $env:VCPKG_ROOT "installed\x64-windows-static"
          $dynamicRoot = Join-Path $env:VCPKG_ROOT "installed\x64-windows"
          $staticLib = Join-Path $staticRoot "lib"
          $dynamicLib = Join-Path $dynamicRoot "lib"
          $staticInclude = Join-Path $staticRoot "include"

          $env:INCLUDE = "$staticInclude;$env:INCLUDE"
          $env:LIB = "$env:MFX_STUB_DIR;$staticLib;$dynamicLib;$env:LIB"

          $dynamicBin = Join-Path $dynamicRoot "bin"
          if (Test-Path -LiteralPath $dynamicBin) {
            $env:PATH = "$env:MSVC_BIN;$dynamicBin;$env:PATH"
          }

          Remove-Item Env:RUSTFLAGS -ErrorAction SilentlyContinue

          # Explicitly link all necessary Media Foundation and FFmpeg libs
          $rustFlags = @(
            "-L", "native=$env:MFX_STUB_DIR",
            "-L", "native=$staticLib",
            "-L", "native=$dynamicLib",
            "-l", "dylib=swresample",
            "-l", "dylib=mfplat",
            "-l", "dylib=mfuuid",
            "-l", "dylib=strmiids",
            "-l", "dylib=wmcodecdspuuid",
            "-C", "link-arg=/NODEFAULTLIB:LIBCMT"
          )

          $env:CARGO_ENCODED_RUSTFLAGS = $rustFlags -join ([char]0x1f)

          $cmd = Get-Command link.exe -CommandType Application | Select-Object -First 1
          Write-Host "Validated Linker: $($cmd.Source)"

          python -u build.py --flutter --hwcodec 2>&1 | Tee-Object -FilePath "build-full.log"

          $buildExitCode = $LASTEXITCODE
          Write-Host "BUILD_EXIT_CODE=$buildExitCode"

          if ($buildExitCode -ne 0) {
            exit $buildExitCode
          }

      - name: Upload Diagnostic Build Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: beenetdesk-windows-binaries
          path: |
            target/release/*.dll
            target/release/*.exe
            build/windows/runner/Release/
            build/windows/x64/runner/Release/
            flutter/build/windows/runner/Release/
            flutter/build/windows/x64/runner/Release/
          if-no-files-found: error

      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beenetdesk-windows-build-logs
          path: |
            build-full.log
            build-environment.log
            *.log
            target/release/build/**/*.log
            target/debug/build/**/*.log
            build/**/*.log
            flutter/build/**/*.log
          if-no-files-found: warn

name: Build BeeNet Desk Windows

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Client
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Build Tools
        run: |
          choco install nasm yasm llvm ninja -y

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests toml

      - name: Build BeeNet Desk (Windows)
        shell: cmd
        env:
          RENDEZVOUS_SERVER: ${{ secrets.RENDEZVOUS_SERVER || '5.202.90.37' }}
          RS_PUB_KEY: ${{ secrets.RS_PUB_KEY || 'urwMFu4fL6ov3jSaG+KZoduD6OdSp3sstm6iwiaWDGw=' }}
        run: |
          python build.py --flutter --hwcodec

      - name: Upload Windows Executable
        uses: actions/upload-artifact@v4
        with:
          name: BeeNet-Desk-Windows
          path: |
            target/release/*.exe
            build/windows/runner/Release/*.exe
            *.exe
          if-no-files-found: warn

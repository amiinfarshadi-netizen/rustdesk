name: BeeNet Windows Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Setup and Install vcpkg Dependencies
        shell: powershell
        run: |
          $vcpkgDir = "$env:VCPKG_INSTALLATION_ROOT"
          if (-not (Test-Path "$vcpkgDir\vcpkg.exe")) {
            $vcpkgDir = "C:\vcpkg"
          }
          Write-Host "Using VCPKG at: $vcpkgDir"
          
          # نصب وابستگی‌های استاتیک در حالت Classic برای دور زدن Manifest Mode
          & "$vcpkgDir\vcpkg.exe" install --classic libvpx:x64-windows-static libyuv:x64-windows-static opus:x64-windows-static aom:x64-windows-static
          
          echo "VCPKG_ROOT=$vcpkgDir" >> $env:GITHUB_ENV

      - name: Flutter Rust Bridge Codegen
        shell: powershell
        run: |
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --locked
          flutter_rust_bridge_codegen --rust-input libs/hbb_common/src/lib.rs --dart-output flutter/lib/generated_bridge.dart

      - name: Run Build Script
        shell: powershell
        run: |
          python -u build.py --flutter --skip-portable-pack

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build-full.log
            *.log

      - name: Upload Binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beenetdesk-windows-binaries
          path: |
            flutter/build/windows/x64/runner/Release/**
            target/release/librustdesk.dll
            target/release/dylib_virtual_display.dll

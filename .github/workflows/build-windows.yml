name: BeeNet Windows Build

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: windows-2022
    env:
      VCPKG_ROOT: C:\vcpkg
      RUST_BACKTRACE: full

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC Developer Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Setup vcpkg and Dependencies
        shell: pwsh
        run: |
          echo "VCPKG_ROOT=C:\vcpkg" >> $env:GITHUB_ENV
          cd C:\vcpkg
          .\vcpkg.exe integrate install
          .\vcpkg.exe install opus libvpx aom ffmpeg --triplet x64-windows-static

      - name: Install LLVM
        shell: pwsh
        run: |
          choco install llvm -y --no-progress
          echo "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Flutter Rust Bridge Codegen
        shell: pwsh
        run: |
          cargo install flutter_rust_bridge_codegen --version 1.80.1

      - name: Flutter Rust Bridge Codegen
        shell: pwsh
        run: |
          flutter_rust_bridge_codegen --rust-input src/flutter_ffi.rs --dart-output flutter/lib/generated_bridge.dart || true

      - name: Patch hwcodec for newer FFmpeg
        shell: pwsh
        run: |
          cargo fetch
          $checkoutRoot = Join-Path $env:USERPROFILE ".cargo\git\checkouts"
          
          # Patch util.cpp
          $utilFiles = Get-ChildItem -Path $checkoutRoot -Recurse -Filter util.cpp -ErrorAction SilentlyContinue
          foreach ($file in $utilFiles) {
            Write-Host "Patching: $($file.FullName)"
            $content = Get-Content $file.FullName -Raw
            if ($content -notmatch "AV_PROFILE_H264_HIGH") {
              $shim = @"
          #ifndef FF_PROFILE_H264_HIGH
          #define FF_PROFILE_H264_HIGH AV_PROFILE_H264_HIGH
          #endif
          #ifndef FF_PROFILE_HEVC_MAIN
          #define FF_PROFILE_HEVC_MAIN AV_PROFILE_HEVC_MAIN
          #endif

          "@
              $content = $shim + $content
              Set-Content -Path $file.FullName -Value $content -NoNewline
            }
          }
          
          # Patch ffmpeg_ram_decode.cpp
          $decodeFiles = Get-ChildItem -Path $checkoutRoot -Recurse -Filter ffmpeg_ram_decode.cpp -ErrorAction SilentlyContinue
          foreach ($file in $decodeFiles) {
            Write-Host "Patching: $($file.FullName)"
            $content = Get-Content $file.FullName -Raw
            $content = $content -replace 'frame->key_frame', '((frame->flags & AV_FRAME_FLAG_KEY) != 0)'
            Set-Content -Path $file.FullName -Value $content -NoNewline
          }

      - name: Run build.py directly
        shell: cmd
        env:
          VCPKG_ROOT: C:\vcpkg
          RENDEZVOUS_SERVER: "5.202.90.37"
          RS_PUB_KEY: "urwMFu4fL6ov3jSaG+KZoduD6OdSp3sstm6iwiaWDGw="
          RUST_BACKTRACE: "full"
        run: |
          python -u build.py --flutter --hwcodec
          echo EXITCODE=%ERRORLEVEL%
          exit %ERRORLEVEL%

      - name: Upload Logs on Failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beenet-build-logs
          path: |
            build-full.log
            build-stdout.log
            build-stderr.log
          if-no-files-found: ignore

      - name: Upload Binaries
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: beenet-windows-binaries
          path: |
            target/release/librustdesk.dll
            target/release/dylib_virtual_display.dll
            target/release/deps/dylib_virtual_display.dll
            flutter/build/windows/x64/runner/Release/**
          if-no-files-found: ignore

name: Build Windows Client

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      RS_PUB_KEY: ${{ secrets.RS_PUB_KEY }}
    
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Setup MSVC Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Setup Rust Toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
        targets: x86_64-pc-windows-msvc

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.0'
        channel: 'stable'

    - name: Restore vcpkg Cache
      id: vcpkg-cache
      uses: actions/cache@v4
      with:
        path: C:\vcpkg\installed
        key: beenetdesk-vcpkg-${{ runner.os }}-x64-static-v1

    - name: Setup vcpkg and Dependencies
      shell: bash
      run: |
        vcpkg install libvpx:x64-windows-static libyuv:x64-windows-static opus:x64-windows-static

    - name: Provide libmfx Stub/Static Lib for hwcodec
      shell: bash
      run: |
        # ایجاد فایل‌های استاب برای جلوگیری از خطای لینک در hwcodec
        mkdir -p libs/hwcodec/lib
        echo "stub" > libs/hwcodec/lib/libmfx.lib

    - name: Cargo Fetch & Patch hwcodec for newer FFmpeg
      shell: bash
      run: |
        cargo fetch
        # در صورت نیاز به پچ خاص برای ffmpeg یا وابستگی‌ها در اینجا اضافه کنید

    - name: Run Build Script
      shell: bash
      run: |
        python3 build.py --release

    - name: Upload Binaries
      uses: actions/upload-artifact@v4
      with:
        name: beenet-windows-binaries
        path: target/release/*.exe

name: Build BeeNet Desk Windows

on:
  workflow_dispatch:
  push:

jobs:
  build-windows:
runs-on: windows-2022

steps:
- name: Checkout repository
uses: actions/checkout@v4

- name: Setup Python
uses: actions/setup-python@v5
with:
python-version: "3.11"

- name: Setup Rust
uses: dtolnay/rust-toolchain@stable
with:
targets: x86_64-pc-windows-msvc

- name: Setup Flutter
uses: subosito/flutter-action@v2
with:
flutter-version: "3.24.5"
channel: stable

- name: Diagnostic checks
shell: pwsh
run: |
$ErrorActionPreference = "Continue"

Write-Host "=== Current directory ==="
Get-Location

Write-Host "=== Repository files ==="
Get-ChildItem -Force

Write-Host "=== Tool versions ==="
python --version
rustc --version
cargo --version
"
python --version
rustc --version
cargo --version
-Path ".\build.py") {
Write-Host "FOUND: build.py"
} else {
Write-Error "MISSING: build.py"
exit 1
}

if (Test-Path ".\pubspec.yaml") {
Write-Host "FOUND: pubspec.yaml"
} else {
Write-Host "WARNING: pubspec.yaml not found"
}

Write-Host "=== build.py help ==="
python -u ".\build.py" --help

- name: Run Build Script
shell: pwsh
env:

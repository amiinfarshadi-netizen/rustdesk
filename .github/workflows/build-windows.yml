name: BeeNet Windows Build

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows Client
    runs-on: windows-2022

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Ensure Submodules are Initialized
        shell: bash
        run: |
          git submodule update --init --recursive

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Configure Flutter for Windows Desktop
        shell: bash
        run: |
          flutter config --enable-windows-desktop
          flutter doctor -v

      - name: Setup LLVM and Clang (for bindgen)
        shell: bash
        run: |
          echo "LIBCLANG_PATH=C:/Program Files/LLVM/bin" >> $GITHUB_ENV
          echo "LLVM_HOME=C:/Program Files/LLVM" >> $GITHUB_ENV
          echo "C:/Program Files/LLVM/bin" >> $GITHUB_PATH

      - name: Setup vcpkg and Build Dependencies
        shell: bash
        run: |
          TARGET_VCPKG="C:/vcpkg"
          if [ -d "$VCPKG_INSTALLATION_ROOT" ]; then
            TARGET_VCPKG="$VCPKG_INSTALLATION_ROOT"
          fi
          cd "$TARGET_VCPKG"
          ./vcpkg.exe integrate install
          ./vcpkg.exe install libvpx:x64-windows libvpx:x64-windows-static libyuv:x64-windows libyuv:x64-windows-static opus:x64-windows opus:x64-windows-static aom:x64-windows aom:x64-windows-static
          echo "VCPKG_ROOT=$TARGET_VCPKG" >> $GITHUB_ENV

      - name: Provide libmfx Stub for hwcodec
        shell: cmd
        run: |
          if not exist target\debug mkdir target\debug
          if not exist target\release mkdir target\release
          echo void MFXInit() {} > mfx_stub.c
          echo void MFXClose() {} >> mfx_stub.c
          cl /c mfx_stub.c /Fo:mfx_stub.obj
          lib /OUT:libmfx.lib mfx_stub.obj
          copy /Y libmfx.lib target\debug\libmfx.lib
          copy /Y libmfx.lib target\release\libmfx.lib

      - name: Prepare Flutter Packages
        shell: bash
        run: |
          if [ -d "flutter" ]; then
            cd flutter
            flutter pub get
          else
            flutter pub get
          fi

      - name: Install Flutter Rust Bridge Codegen
        shell: bash
        run: |
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --locked || true

      - name: Run Flutter Rust Bridge Codegen
        shell: bash
        run: |
          if [ -d "flutter" ]; then
            flutter_rust_bridge_codegen --rust-input rust/src/api.rs --dart-output flutter/lib/bridge_generated.dart || true
          else
            flutter_rust_bridge_codegen --rust-input rust/src/api.rs --dart-output lib/bridge_generated.dart || true
          fi

      - name: Remove locked flag & Fix Linker Conflict
        shell: bash
        run: |
          # حذف فلگ بازدارنده --locked
          sed -i 's/--locked//g' build.py || true
          # حذف link.exe مربوط به Git Bash برای جلوگیری از تداخل با MSVC Linker
          rm -f "/c/Program Files/Git/usr/bin/link.exe" || true

      - name: Run Build Script
        shell: cmd
        env:
          RS_PUB_KEY: ${{ secrets.RS_PUB_KEY }}
          VCPKG_ROOT: C:\vcpkg
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
          BINDGEN_EXTRA_CLANG_ARGS: -I C:/vcpkg/installed/x64-windows/include -I C:/vcpkg/installed/x64-windows-static/include
        run: |
          python build.py

      - name: Upload Build Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: beenetdesk-windows-binaries
          path: |
            target/release/*.dll
            target/release/*.exe
            build/windows/runner/Release/*
            build/windows/x64/runner/Release/*

      - name: Upload Build Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-logs
          path: |
            *.log
            target/release/build/**/*.log
            build/**/*.log

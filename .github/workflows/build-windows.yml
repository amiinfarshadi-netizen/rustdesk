name: Build BeeNet Desk Windows

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Client
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Install dependencies via Chocolatey
        shell: powershell
        run: |
          choco install nasm yasm ninja llvm -y

      - name: Inject BeeNet Configs
        shell: powershell
        run: |
          $server = "5.202.90.37"
          $key = "urwMFu4fL6ov3jSaG+KZoduD6OdSp3sstm6iwiaWDGw="
          [System.Environment]::SetEnvironmentVariable('RENDEZVOUS_SERVER', $server, "Process")
          [System.Environment]::SetEnvironmentVariable('RS_PUB_KEY', $key, "Process")
          Write-Host "Injected Server: $server"

      - name: Run Build Script
        shell: powershell
        env:
          RENDEZVOUS_SERVER: '5.202.90.37'
          RS_PUB_KEY: 'urwMFu4fL6ov3jSaG+KZoduD6OdSp3sstm6iwiaWDGw='
        run: |
          python -m pip install --upgrade pip requests toml
          python build.py --flutter --hwcodec

      - name: Upload Windows Executable
        uses: actions/upload-artifact@v4
        with:
          name: BeeNet-Desk-Windows
          path: |
            target/release/*.exe
            build/windows/runner/Release/*.exe
            rustdesk-*.exe
            *.exe
          if-no-files-found: warn

name: BeeNet Windows Build

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows Client
    runs-on: windows-2022

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Ensure Submodules are Initialized
        shell: bash
        run: |
          git submodule update --init --recursive

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Configure Flutter for Windows Desktop
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          flutter config --enable-windows-desktop
          flutter doctor -v

      - name: Setup LLVM and Clang (for bindgen)
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          echo "LIBCLANG_PATH=C:/Program Files/LLVM/bin" >> "$GITHUB_ENV"
          echo "LLVM_HOME=C:/Program Files/LLVM" >> "$GITHUB_ENV"
          echo "C:/Program Files/LLVM/bin" >> "$GITHUB_PATH"

      - name: Setup vcpkg and Build Dependencies
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail

          TARGET_VCPKG="C:/vcpkg"

          if [ -n "${VCPKG_INSTALLATION_ROOT:-}" ] && [ -d "$VCPKG_INSTALLATION_ROOT" ]; then
            TARGET_VCPKG="$VCPKG_INSTALLATION_ROOT"
          fi

          cd "$TARGET_VCPKG"

          if [ ! -f "./vcpkg.exe" ]; then
            echo "[ERROR] vcpkg.exe not found in $TARGET_VCPKG"
            exit 1
          fi

          # Ensure vcpkg itself also uses the selected installation.
          export VCPKG_ROOT="$TARGET_VCPKG"

          ./vcpkg.exe integrate install

          ./vcpkg.exe install \
            libvpx:x64-windows \
            libvpx:x64-windows-static \
            libyuv:x64-windows \
            libyuv:x64-windows-static \
            opus:x64-windows \
            opus:x64-windows-static \
            aom:x64-windows \
            aom:x64-windows-static

          ./vcpkg.exe install \
            "ffmpeg[core,avcodec,avformat,swscale,swresample]:x64-windows" \
            "ffmpeg[core,avcodec,avformat,swscale,swresample]:x64-windows-static"

          echo "VCPKG_ROOT=$TARGET_VCPKG" >> "$GITHUB_ENV"

      # Temporary diagnostic workaround, not a real Intel Media SDK library.
      - name: Provide libmfx Stub for hwcodec
        shell: cmd
        working-directory: ${{ github.workspace }}
        run: |
          if not exist target\debug mkdir target\debug
          if not exist target\release mkdir target\release

          echo void MFXInit() {} > mfx_stub.c
          echo void MFXClose() {} >> mfx_stub.c

          cl /c mfx_stub.c /Fo:mfx_stub.obj
          if errorlevel 1 exit /B 1

          lib /OUT:libmfx.lib mfx_stub.obj
          if errorlevel 1 exit /B 1

          if not exist libmfx.lib (
            echo [ERROR] libmfx.lib was not created.
            exit /B 1
          )

          copy /Y libmfx.lib target\debug\libmfx.lib
          if errorlevel 1 exit /B 1

          copy /Y libmfx.lib target\release\libmfx.lib
          if errorlevel 1 exit /B 1

          echo [INFO] Temporary libmfx stub created.
          dir libmfx.lib

      - name: Prepare Flutter Packages
        shell: bash
        run: |
          if [ -d "flutter" ]; then cd flutter; fi
          pwd
          flutter pub get

      - name: Install Flutter Rust Bridge Codegen
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          cargo install flutter_rust_bridge_codegen \
            --version 1.80.1 \
            --locked || true

      - name: Run Flutter Rust Bridge Codegen
        shell: bash
        run: |
          if [ -d "flutter" ]; then cd flutter; fi
          flutter_rust_bridge_codegen \
            --rust-input ../rust/src/api.rs \
            --dart-output lib/bridge_generated.dart \
            || flutter_rust_bridge_codegen \
              --rust-input rust/src/api.rs \
              --dart-output lib/bridge_generated.dart \
            || true

      - name: Remove locked flag & Fix Linker Conflict
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          sed -i 's/--locked//g' build.py || true
          rm -f "/c/Program Files/Git/usr/bin/link.exe" || true

      - name: Pre-fetch and Patch hwcodec for FFmpeg
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          cargo fetch || true
          python -c "
          import os, glob

          cargo_home = os.path.expanduser('~/.cargo/git/checkouts')
          hwcodec_files = glob.glob(f'{cargo_home}/**/hwcodec*/**/cpp/**/*.cpp', recursive=True)
          hwcodec_files += glob.glob(f'{cargo_home}/**/hwcodec*/**/cpp/**/*.h', recursive=True)

          for f in hwcodec_files:
              with open(f, 'r', encoding='utf-8', errors='ignore') as fp:
                  content = fp.read()
              new_content = content
              if 'FF_PROFILE_H264_HIGH' in new_content and '#define FF_PROFILE_H264_HIGH' not in new_content:
                  new_content = '#ifndef FF_PROFILE_H264_HIGH\n#define FF_PROFILE_H264_HIGH 100\n#endif\n' + new_content
              if 'FF_PROFILE_HEVC_MAIN' in new_content and '#define FF_PROFILE_HEVC_MAIN' not in new_content:
                  new_content = '#ifndef FF_PROFILE_HEVC_MAIN\n#define FF_PROFILE_HEVC_MAIN 1\n#endif\n' + new_content
              new_content = new_content.replace('->key_frame', '->flags & AV_FRAME_FLAG_KEY')
              if new_content != content:
                  with open(f, 'w', encoding='utf-8') as fp:
                      fp.write(new_content)
                  print(f'Successfully patched: {f}')
          " || true

      - name: Verify MSVC Environment (kernel32.lib check)
        shell: cmd
        run: |
          echo INCLUDE=%INCLUDE%
          echo LIB=%LIB%

          where cl
          if errorlevel 1 exit /B 1

          where link
          if errorlevel 1 exit /B 1

          if exist "%WindowsSdkDir%lib\%WindowsSDKVersion%\um\x64\kernel32.lib" (
            echo [OK] kernel32.lib found in Windows SDK.
          ) else (
            echo [ERROR] kernel32.lib NOT found in Windows SDK path!
            exit /B 1
          )

      - name: Run Build Script
        shell: cmd
        working-directory: ${{ github.workspace }}
        env:
          RENDEZVOUS_SERVER: "5.202.90.37"
          RS_PUB_KEY: ${{ secrets.RS_PUB_KEY }}
          RUST_BACKTRACE: "full"
          VCPKG_DEFAULT_TRIPLET: x64-windows-static
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
        run: |
          rem Use VCPKG_ROOT exported by the dependency installation step.
          if not defined VCPKG_ROOT (
            echo [ERROR] VCPKG_ROOT is not defined.
            exit /B 1
          )

          if not exist "%VCPKG_ROOT%\installed\x64-windows-static\lib" (
            echo [ERROR] Static vcpkg library directory does not exist.
            echo VCPKG_ROOT=%VCPKG_ROOT%
            exit /B 1
          )

          rem Preserve existing MSVC and Windows SDK paths.
          set "INCLUDE=%VCPKG_ROOT%\installed\x64-windows-static\include;%VCPKG_ROOT%\installed\x64-windows\include;%INCLUDE%"
          set "LIB=%GITHUB_WORKSPACE%;%VCPKG_ROOT%\installed\x64-windows-static\lib;%VCPKG_ROOT%\installed\x64-windows\lib;%LIB%"

          rem Check the library produced by the existing stub step.
          if not exist "%GITHUB_WORKSPACE%\libmfx.lib" (
            echo [ERROR] libmfx.lib is missing from the workspace root.
            exit /B 1
          )

          rem Explicitly expose the native library directory to rustc.
          set RUSTFLAGS=%RUSTFLAGS% -L "native=%GITHUB_WORKSPACE%"

          echo [INFO] VCPKG_ROOT=%VCPKG_ROOT%
          echo [INFO] RUSTFLAGS=%RUSTFLAGS%
          echo INCLUDE=%INCLUDE%
          echo LIB=%LIB%
          dir "%GITHUB_WORKSPACE%\libmfx.lib"

          python -u build.py --flutter --hwcodec
          set "BUILD_EXIT_CODE=%ERRORLEVEL%"

          echo EXITCODE=%BUILD_EXIT_CODE%
          exit /B %BUILD_EXIT_CODE%

      - name: Upload Build Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: beenetdesk-windows-binaries
          path: |
            target/release/*.dll
            target/release/*.exe
            build/windows/runner/Release/*
            build/windows/x64/runner/Release/*
            flutter/build/windows/runner/Release/*
            flutter/build/windows/x64/runner/Release/*
          if-no-files-found: warn

      - name: Upload Build Logs on Failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-logs
          path: |
            *.log
            target/release/build/**/*.log
            build/**/*.log
            flutter/build/**/*.log
            build-full.log
            build-stdout.log
            build-stderr.log
          if-no-files-found: warn

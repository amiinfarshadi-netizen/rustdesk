name: BeeNet Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 120

    env:
      VCPKG_ROOT: C:\vcpkg
      VCPKG_INSTALLATION_ROOT: C:\vcpkg
      RUST_BACKTRACE: 1

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup MSVC Developer Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Setup vcpkg and Dependencies
        shell: powershell
        run: |
          if (!(Test-Path "C:\vcpkg")) {
            git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
          }

          & "C:\vcpkg\bootstrap-vcpkg.bat"

          & "C:\vcpkg\vcpkg.exe" install --classic `
            libvpx:x64-windows-static `
            libyuv:x64-windows-static `
            opus:x64-windows-static `
            aom:x64-windows-static

      - name: Install LLVM
        shell: powershell
        run: |
          choco install llvm -y

      - name: Add LLVM to PATH
        shell: powershell
        run: |
          echo "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Flutter Rust Bridge Codegen
        shell: powershell
        run: |
          dart pub global activate flutter_rust_bridge_codegen

      - name: Flutter Rust Bridge Codegen
        shell: powershell
        run: |
          flutter_rust_bridge_codegen generate

      - name: Run Build Script
        shell: powershell
        run: |
          python build.py --flutter --skip-portable-pack

      - name: Upload Binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beenetdesk-windows-binaries
          path: |
            target/release/*.exe
            target/release/*.dll
            flutter/build/windows/x64/runner/Release/**
          if-no-files-found: ignore

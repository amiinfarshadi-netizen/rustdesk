name: Build Windows Client

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout BeeNet Desk Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Patch Cargo.toml
        shell: pwsh
        run: |
          if (Test-Path Cargo.toml) {
            (Get-Content Cargo.toml) -replace 'default-run\s*=', '# default-run =' | Set-Content Cargo.toml
            Write-Host "Patched Cargo.toml successfully."
          }

      - name: Run Build Script
        shell: pwsh
        run: |
          python build.py --flutter 2>&1 | Tee-Object -FilePath "build-full.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-and-binaries
          path: |
            build-full.log
            build/windows/runner/Release/
            target/release/*.exe
          if-no-files-found: ignore

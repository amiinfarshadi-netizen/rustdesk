name: Build BeeNet Desk Windows

on: [workflow_dispatch, push]

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        shell: bash
        run: |
          choco install nasm yasm llvm -y

      - name: Flutter pub get
        shell: bash
        run: |
          cd flutter
          flutter pub get
          cd ..

      - name: Set Environment Secrets
        shell: bash
        run: |
          echo "RENDEZVOUS_SERVER=${{ secrets.RENDEZVOUS_SERVER }}" >> $GITHUB_ENV
          echo "RS_PUB_KEY=${{ secrets.RS_PUB_KEY }}" >> $GITHUB_ENV

      - name: Run Build Script
        shell: bash
        run: |
          python3 build.py --flutter --hwcodec

      - name: Upload Windows Output
        uses: actions/upload-artifact@v4
        with:
          name: BeeNetDesk-Windows
          path: |
            flutter/build/windows/runner/Release/**
            target/release/*.exe
            build/*.exe

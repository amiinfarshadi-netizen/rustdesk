name: BeeNet Windows Build

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
      - name: Run build.py
        shell: pwsh
        env:
          RENDEZVOUS_SERVER: "5.202.90.37"
          RS_PUB_KEY: "urwMFu4fL6ov3jSaG+KZoduD6OdSp3sstm6iwiaWDGw="
          RUST_BACKTRACE: "full"
        run: |
          python -u .\build.py --flutter --hwcodec 2>&1 | Tee-Object build

name: BeeNet Windows Build

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Windows Client
    runs-on: windows-2022

    defaults:
      run:
        shell: pwsh

    env:
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: full
      VCPKG_DEFAULT_TRIPLET: x64-windows-static

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Ensure Submodules are Initialized
        run: |
          git submodule update --init --recursive
          if ($LASTEXITCODE -ne 0) {
            throw "Submodule initialization failed."
          }

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Pin and Verify MSVC Tools
        run: |
          $ErrorActionPreference = "Stop"

          if (-not $env:VCToolsInstallDir) {
            throw "VCToolsInstallDir is not defined."
          }

          $msvcBin = Join-Path $env:VCToolsInstallDir "bin\Hostx64\x64"
          $linker = Join-Path $msvcBin "link.exe"
          $compiler = Join-Path $msvcBin "cl.exe"
          $librarian = Join-Path $msvcBin "lib.exe"

          foreach ($tool in @($linker, $compiler, $librarian)) {
            if (-not (Test-Path -LiteralPath $tool)) {
              throw "MSVC tool not found: $tool"
            }
          }

          # Persist for all subsequent steps.
          $msvcBin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

          @(
            "MSVC_BIN=$msvcBin"
            "MSVC_LINK_EXE=$linker"
            "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$linker"
          ) | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          # GITHUB_PATH takes effect in the next step.
          $env:PATH = "$msvcBin;$env:PATH"

          Write-Host "Selected MSVC linker: $linker"

          where.exe cl
          if ($LASTEXITCODE -ne 0) { throw "cl.exe not found." }

          where.exe link
          if ($LASTEXITCODE -ne 0) { throw "link.exe not found." }

          where.exe lib
          if ($LASTEXITCODE -ne 0) { throw "lib.exe not found." }

          if (-not $env:WindowsSdkDir -or -not $env:WindowsSDKVersion) {
            throw "Windows SDK environment is incomplete."
          }

          $sdkVersion = $env:WindowsSDKVersion.TrimEnd('\', '/')
          $kernel32 = Join-Path $env:WindowsSdkDir `
            "Lib\$sdkVersion\um\x64\kernel32.lib"

          if (-not (Test-Path -LiteralPath $kernel32)) {
            throw "kernel32.lib not found: $kernel32"
          }

          Write-Host "[OK] kernel32.lib: $kernel32"

          rustc -vV
          if ($LASTEXITCODE -ne 0) { throw "rustc failed." }

          cargo --version
          if ($LASTEXITCODE -ne 0) { throw "cargo failed." }

      - name: Configure Flutter for Windows Desktop
        run: |
          flutter config --enable-windows-desktop
          if ($LASTEXITCODE -ne 0) {
            throw "Flutter desktop configuration failed."
          }

          flutter doctor -v
          if ($LASTEXITCODE -ne 0) {
            throw "flutter doctor failed."
          }

      - name: Setup LLVM and Clang for bindgen
        run: |
          $ErrorActionPreference = "Stop"

          $llvmHome = "C:\Program Files\LLVM"
          $llvmBin = Join-Path $llvmHome "bin"
          $libclang = Join-Path $llvmBin "libclang.dll"

          if (-not (Test-Path -LiteralPath $libclang)) {
            throw "libclang.dll not found: $libclang"
          }

          @(
            "LIBCLANG_PATH=$llvmBin"
            "LLVM_HOME=$llvmHome"
          ) | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          $llvmBin |
            Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

          # Keep MSVC ahead of other native tools.
          $env:MSVC_BIN |
            Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

          Write-Host "[OK] libclang.dll: $libclang"

      - name: Setup vcpkg and Build Dependencies
        run: |
          $ErrorActionPreference = "Stop"

          $env:PATH = "$env:MSVC_BIN;$env:PATH"

          $vcpkgRoot = "C:\vcpkg"

          if (
            $env:VCPKG_INSTALLATION_ROOT -and
            (Test-Path -LiteralPath $env:VCPKG_INSTALLATION_ROOT)
          ) {
            $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          }

          $vcpkgExe = Join-Path $vcpkgRoot "vcpkg.exe"

          if (-not (Test-Path -LiteralPath $vcpkgExe)) {
            throw "vcpkg.exe not found: $vcpkgExe"
          }

          $env:VCPKG_ROOT = $vcpkgRoot
          Set-Location $vcpkgRoot

          & $vcpkgExe integrate install
          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg integrate install failed."
          }

          $packages = @(
            "libvpx:x64-windows"
            "libvpx:x64-windows-static"
            "libyuv:x64-windows"
            "libyuv:x64-windows-static"
            "opus:x64-windows"
            "opus:x64-windows-static"
            "aom:x64-windows"
            "aom:x64-windows-static"
            "ffmpeg[core,avcodec,avformat,swscale,swresample]:x64-windows"
            "ffmpeg[core,avcodec,avformat,swscale,swresample]:x64-windows-static"
          )

          & $vcpkgExe install @packages
          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg dependency installation failed."
          }

          "VCPKG_ROOT=$vcpkgRoot" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # Diagnostic only. NOT a functional Intel Media SDK implementation.
      - name: Provide Diagnostic MFX Stubs
        working-directory: ${{ github.workspace }}
        run: |
          $ErrorActionPreference = "Stop"

          $env:PATH = "$env:MSVC_BIN;$env:PATH"

          $stubDir = Join-Path $env:GITHUB_WORKSPACE "native-stubs"
          New-Item -ItemType Directory -Force -Path $stubDir | Out-Null

          $source = Join-Path $stubDir "mfx_stub.c"
          $object = Join-Path $stubDir "mfx_stub.obj"
          $libmfx = Join-Path $stubDir "libmfx.lib"
          $mfx = Join-Path $stubDir "mfx.lib"

          @'
          /*
           * Diagnostic symbol placeholders only.
           * These are NOT ABI-compatible Media SDK implementations.
           * Do not distribute a build using these stubs.
           */
          void MFXInit(void) {}
          void MFXClose(void) {}
          '@ | Set-Content -LiteralPath $source -Encoding ascii

          & "$env:MSVC_BIN\cl.exe" /nologo /c $source "/Fo$object"
          if ($LASTEXITCODE -ne 0) {
            throw "MFX stub compilation failed."
          }

          & "$env:MSVC_BIN\lib.exe" /nologo "/OUT:$libmfx" $object
          if ($LASTEXITCODE -ne 0) {
            throw "MFX stub archive creation failed."
          }

          Copy-Item -LiteralPath $libmfx -Destination $mfx -Force

          $destinations = @(
            $env:GITHUB_WORKSPACE
            (Join-Path $env:GITHUB_WORKSPACE "target\debug")
            (Join-Path $env:GITHUB_WORKSPACE "target\release")
          )

          foreach ($destination in $destinations) {
            New-Item -ItemType Directory -Force -Path $destination |
              Out-Null

            Copy-Item -LiteralPath $libmfx -Destination $destination -Force
            Copy-Item -LiteralPath $mfx -Destination $destination -Force
          }

          "MFX_STUB_DIR=$stubDir" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          Get-Item -LiteralPath $libmfx, $mfx |
            Select-Object FullName, Length |
            Format-Table -AutoSize

          & "$env:MSVC_BIN\lib.exe" /nologo /list $libmfx
          if ($LASTEXITCODE -ne 0) {
            throw "MFX stub archive verification failed."
          }

          Write-Warning "MFX stubs are diagnostic only, not production libraries."

      - name: Prepare Flutter Packages
        working-directory: ${{ github.workspace }}
        run: |
          $ErrorActionPreference = "Stop"

          if (Test-Path -LiteralPath "flutter\pubspec.yaml") {
            Set-Location "flutter"
          } elseif (-not (Test-Path -LiteralPath "pubspec.yaml")) {
            throw "Flutter pubspec.yaml was not found."
          }

          flutter pub get
          if ($LASTEXITCODE -ne 0) {
            throw "flutter pub get failed."
          }

      - name: Install Flutter Rust Bridge Codegen
        working-directory: ${{ github.workspace }}
        run: |
          $ErrorActionPreference = "Stop"
          $env:PATH = "$env:MSVC_BIN;$env:PATH"

          Write-Host "Cargo linker: $env:CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER"

          cargo install flutter_rust_bridge_codegen `
            --version 1.80.1 `
            --locked `
            -vv

          if ($LASTEXITCODE -ne 0) {
            throw "Flutter Rust Bridge Codegen installation failed."
          }

          flutter_rust_bridge_codegen --version
          if ($LASTEXITCODE -ne 0) {
            throw "Flutter Rust Bridge Codegen verification failed."
          }

      - name: Run Flutter Rust Bridge Codegen
        working-directory: ${{ github.workspace }}
        run: |
          $ErrorActionPreference = "Stop"
          $env:PATH = "$env:MSVC_BIN;$env:PATH"

          $root = $env:GITHUB_WORKSPACE

          $candidates = @(
            (Join-Path $root "rust\src\api.rs"),
            (Join-Path $root "src\api.rs"),
            (Join-Path $root "src\flutter_ffi.rs")
          )

          $rustInput = $candidates |
            Where-Object { Test-Path -LiteralPath $_ } |
            Select-Object -First 1

          if ($rustInput) {
            if (Test-Path -LiteralPath (Join-Path $root "flutter\pubspec.yaml")) {
              $flutterDir = Join-Path $root "flutter"
            } elseif (Test-Path -LiteralPath (Join-Path $root "pubspec.yaml")) {
              $flutterDir = $root
            } else {
              $flutterDir = $root
            }

            Set-Location $flutterDir
            $dartOutput = Join-Path $flutterDir "lib\bridge_generated.dart"

            Write-Host "Running Flutter Rust Bridge codegen..."
            Write-Host "Rust input: $rustInput"
            Write-Host "Dart output: $dartOutput"

            flutter_rust_bridge_codegen `
              --rust-input $rustInput `
              --dart-output $dartOutput

            if ($LASTEXITCODE -ne 0) {
              Write-Warning "Codegen completed with non-zero exit code or skipped."
            }
          } else {
            Write-Host "No standalone api.rs found. Pre-generated bridge files are present in the repository; skipping codegen step."
          }

      - name: Prepare build.py for Diagnostic Build
        working-directory: ${{ github.workspace }}
        run: |
          $ErrorActionPreference = "Stop"

          @'
          from pathlib import Path
          import re

          path = Path("build.py")
          if not path.is_file():
              raise SystemExit("ERROR: build.py not found")

          original = path.read_text(encoding="utf-8")
          updated = original

          # Preserve the previous workflow's unlocked-build behavior,
          # but modify cargo build commands only.
          pattern = r'\bcargo build\b[^\r\n\'"]*'

          matches = list(re.finditer(pattern, original))
          if not matches:
              raise SystemExit("ERROR: No cargo build commands found in build.py")

          def patch_command(match):
              command = match.group(0)
              command = re.sub(r'(?<!\S)--locked\b', '', command)

              if not re.search(r'(?<!\S)-vv\b', command):
                  command = command.replace("cargo build", "cargo build -vv", 1)

              return command

          updated = re.sub(pattern, patch_command, updated)

          # Check Python syntax before replacing the script.
          compile(updated, str(path), "exec")
          path.write_text(updated, encoding="utf-8")

          print(f"Prepared {len(matches)} cargo build command(s).")
          for line_number, line in enumerate(updated.splitlines(), 1):
              if "cargo build" in line:
                  print(f"{line_number}: {line.strip()}")
          '@ | python -

          if ($LASTEXITCODE -ne 0) {
            throw "build.py preparation failed."
          }

      - name: Pre-fetch Dependencies and Patch FFmpeg Profile Constants
        working-directory: ${{ github.workspace }}
        run: |
          $ErrorActionPreference = "Stop"
          $env:PATH = "$env:MSVC_BIN;$env:PATH"

          cargo fetch
          if ($LASTEXITCODE -ne 0) {
            throw "cargo fetch failed."
          }

          @'
          import os
          import re
          from pathlib import Path

          cargo_home = Path(
              os.environ.get("CARGO_HOME", str(Path.home() / ".cargo"))
          )
          checkouts = cargo_home / "git" / "checkouts"

          if not checkouts.is_dir():
              raise SystemExit(f"ERROR: Cargo checkout directory not found: {checkouts}")

          files = set()
          for root in checkouts.glob("*hwcodec*"):
              for path in root.rglob("*"):
                  if (
                      path.is_file()
                      and "cpp" in path.parts
                      and path.suffix.lower() in {".cpp", ".h", ".hpp", ".cc"}
                  ):
                      files.add(path)

          if not files:
              raise SystemExit("ERROR: No hwcodec C/C++ source files found to inspect")

          patched = 0
          for path in sorted(files):
              content = path.read_text(encoding="utf-8")
              updated = content

              constants = {
                  "FF_PROFILE_H264_HIGH": "100",
                  "FF_PROFILE_HEVC_MAIN": "1",
              }

              for name, value in constants.items():
                  defined = re.search(
                      rf"^\s*#\s*define\s+{re.escape(name)}\b",
                      updated,
                      re.MULTILINE,
                  )
                  if name in updated and not defined:
                      updated = (
                          f"#ifndef {name}\n"
                          f"#define {name} {value}\n"
                          f"#endif\n"
                      ) + updated

              # Do not blindly replace ->key_frame.
              # Reads, writes, and operator precedence require different fixes.
              if "->key_frame" in updated:
                  print(f"NOTICE: key_frame compatibility needs review: {path}")

              if updated != content:
                  path.write_text(updated, encoding="utf-8")
                  patched += 1
                  print(f"Patched: {path}")

          print(f"Inspected {len(files)} files; patched {patched} files.")
          '@ | python -

          if ($LASTEXITCODE -ne 0) {
            throw "hwcodec compatibility patch failed."
          }

      - name: Run Build Script
        working-directory: ${{ github.workspace }}
        env:
          RENDEZVOUS_SERVER: "5.202.90.37"
          RS_PUB_KEY: ${{ secrets.RS_PUB_KEY }}
        run: |
          $ErrorActionPreference = "Stop"

          # Native failures are handled explicitly after output is saved.
          $PSNativeCommandUseErrorActionPreference = $false

          $env:PATH = "$env:MSVC_BIN;$env:PATH"

          if (-not $env:VCPKG_ROOT) {
            throw "VCPKG_ROOT is not defined."
          }

          if (-not $env:MFX_STUB_DIR) {
            throw "MFX_STUB_DIR is not defined."
          }

          $staticRoot = Join-Path $env:VCPKG_ROOT "installed\x64-windows-static"
          $dynamicRoot = Join-Path $env:VCPKG_ROOT "installed\x64-windows"
          $staticLib = Join-Path $staticRoot "lib"
          $staticInclude = Join-Path $staticRoot "include"

          foreach ($required in @(
            $staticLib
            $staticInclude
            (Join-Path $env:MFX_STUB_DIR "libmfx.lib")
            (Join-Path $env:MFX_STUB_DIR "mfx.lib")
          )) {
            if (-not (Test-Path -LiteralPath $required)) {
              throw "Required build input not found: $required"
            }
          }

          # Prefer static dependencies. Do not mix dynamic import libraries
          # into LIB as an implicit fallback.
          $env:INCLUDE = "$staticInclude;$env:INCLUDE"
          $env:LIB = "$env:MFX_STUB_DIR;$staticLib;$env:LIB"

          # FFmpeg tools may need DLLs at runtime.
          $dynamicBin = Join-Path $dynamicRoot "bin"
          if (Test-Path -LiteralPath $dynamicBin) {
            $env:PATH = "$env:MSVC_BIN;$dynamicBin;$env:PATH"
          }

          # Cargo splits ordinary RUSTFLAGS on whitespace.
          # Encoded flags preserve each argument, even in paths with spaces.
          Remove-Item Env:RUSTFLAGS -ErrorAction SilentlyContinue

          $rustFlags = @(
            "-L"
            "native=$env:MFX_STUB_DIR"
            "-L"
            "native=$staticLib"
          )

          $env:CARGO_ENCODED_RUSTFLAGS = $rustFlags -join ([char]0x1f)

          $diagnostics = @(
            "MSVC_BIN=$env:MSVC_BIN"
            "CARGO_LINKER=$env:CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER"
            "VCPKG_ROOT=$env:VCPKG_ROOT"
            "MFX_STUB_DIR=$env:MFX_STUB_DIR"
            "RUST_FLAGS=$($rustFlags -join ' | ')"
            "LIB=$env:LIB"
            "INCLUDE=$env:INCLUDE"
          )

          $diagnostics |
            Tee-Object -FilePath "build-environment.log"

          where.exe link
          if ($LASTEXITCODE -ne 0) {
            throw "link.exe not found."
          }

          $resolvedLinker = (Get-Command link.exe -CommandType Application).Source

          if ($resolvedLinker -ine $env:MSVC_LINK_EXE) {
            throw "Incorrect linker selected: $resolvedLinker"
          }

          Get-Item `
            (Join-Path $env:MFX_STUB_DIR "libmfx.lib"), `
            (Join-Path $env:MFX_STUB_DIR "mfx.lib") |
            Select-Object FullName, Length |
            Format-Table -AutoSize

          python -u build.py --flutter --hwcodec 2>&1 |
            Tee-Object -FilePath "build-full.log"

          $buildExitCode = $LASTEXITCODE
          Write-Host "BUILD_EXIT_CODE=$buildExitCode"

          if ($buildExitCode -ne 0) {
            exit $buildExitCode
          }

      - name: Upload Diagnostic Build Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: beenetdesk-windows-diagnostic-not-for-release
          path: |
            target/release/*.dll
            target/release/*.exe
            build/windows/runner/Release/
            build/windows/x64/runner/Release/
            flutter/build/windows/runner/Release/
            flutter/build/windows/x64/runner/Release/
          if-no-files-found: error

      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beenetdesk-windows-build-logs
          path: |
            build-full.log
            build-environment.log
            *.log
            target/release/build/**/*.log
            target/debug/build/**/*.log
            build/**/*.log
            flutter/build/**/*.log
          if-no-files-found: warn

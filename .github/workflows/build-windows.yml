name: BeeNet Windows Build

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows Client
    runs-on: windows-2022

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Ensure Submodules are Initialized
        shell: bash
        run: |
          git submodule update --init --recursive

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Setup LLVM and Clang (for bindgen)
        shell: bash
        run: |
          echo "LIBCLANG_PATH=C:/Program Files/LLVM/bin" >> $GITHUB_ENV
          echo "LLVM_HOME=C:/Program Files/LLVM" >> $GITHUB_ENV
          echo "C:/Program Files/LLVM/bin" >> $GITHUB_PATH

      - name: Setup vcpkg and Build Dependencies
        shell: bash
        run: |
          vcpkg integrate install
          # اگر مانیفست وجود دارد، وابستگی‌های آن نصب می‌شود و پکیج‌های عمومی به شکل کلاسیک نصب می‌شوند
          if [ -f "vcpkg.json" ]; then
            vcpkg install --triplet x64-windows
          fi
          # نصب مستقیم در حالت classic خارج از دایرکتوری دارای vcpkg.json
          (cd "$VCPKG_INSTALLATION_ROOT" && ./vcpkg.exe install libvpx:x64-windows libyuv:x64-windows opus:x64-windows)
          echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> $GITHUB_ENV

      - name: Provide libmfx Stub for hwcodec
        shell: bash
        run: |
          mkdir -p target/debug target/release
          cat << 'EOF' > mfx_stub.c
          void MFXInit() {}
          void MFXClose() {}
          EOF
          cl /c mfx_stub.c /Fo:mfx_stub.obj
          lib /OUT:libmfx.lib mfx_stub.obj
          cp libmfx.lib target/debug/
          cp libmfx.lib target/release/

      - name: Prepare Flutter Packages
        shell: bash
        run: |
          flutter doctor -v
          flutter pub get

      - name: Install Flutter Rust Bridge Codegen
        shell: bash
        run: |
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --locked

      - name: Run Flutter Rust Bridge Codegen
        shell: bash
        run: |
          flutter_rust_bridge_codegen --rust-input rust/src/api.rs --dart-output lib/bridge_generated.dart

      - name: Run Build Script
        shell: bash
        env:
          RS_PUB_KEY: ${{ secrets.RS_PUB_KEY }}
        run: |
          python build.py

      - name: Upload Build Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: beenetdesk-windows-binaries
          path: |
            target/release/*.dll
            target/release/*.exe
            build/windows/runner/Release/*

      - name: Upload Build Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-logs
          path: |
            *.log
            target/release/build/**/*.log

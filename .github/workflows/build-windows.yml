name: BeeNet Windows Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    env:
      VCPKG_ROOT: C:\vcpkg
      VCPKGRS_DYNAMIC: "0"
      VCPKG_DEFAULT_TRIPLET: x64-windows-static

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable

      - name: Setup vcpkg and Dependencies
        shell: powershell
        run: |
          # اطمینان از نصب پکیج‌ها با تریپلت صحیح
          & "C:\vcpkg\vcpkg.exe" install --classic libvpx:x64-windows-static libyuv:x64-windows-static opus:x64-windows-static aom:x64-windows-static

      - name: Install LLVM
        shell: powershell
        run: |
          choco install llvm -y
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      - name: Flutter Rust Bridge Codegen
        shell: powershell
        run: |
          cd flutter
          flutter pub get
          cd ..
          cargo install flutter_rust_bridge_codegen --version 1.80.1
          flutter_rust_bridge_codegen --rust-input src/flutter_ffi.rs --dart-output flutter/lib/generated_bridge.dart

      - name: Run Build Script
        shell: powershell
        run: |
          # اجرای بیلد با تزریق مستقیم متغیرها برای اطمینان از شناسایی هدرها
          $env:INCLUDE = "C:\vcpkg\installed\x64-windows-static\include;" + $env:INCLUDE
          $env:LIB = "C:\vcpkg\installed\x64-windows-static\lib;" + $env:LIB
          python build.py --flutter --skip-portable-pack

      - name: Upload Binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beenet-windows-binaries
          path: |
            target/release/*.exe
            target/release/*.dll
            flutter/build/windows/x64/runner/Release/**

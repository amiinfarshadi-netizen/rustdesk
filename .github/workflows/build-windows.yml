name: BeeNet Windows Build

on:
  workflow_dispatch:
  push:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Setup and Install vcpkg Dependencies
        shell: bash
        run: |
          # استفاده از ریشه پیش‌فرض vcpkg موجود در رانر گیت‌هاب
          VCPKG_DIR="${VCPKG_INSTALLATION_ROOT:-C:/vcpkg}"
          echo "VCPKG_ROOT=$VCPKG_DIR" >> $GITHUB_ENV
          echo "$VCPKG_DIR" >> $GITHUB_PATH

          cd "$VCPKG_DIR"
          ./vcpkg.exe integrate install
          ./vcpkg.exe install opus libvpx aom --triplet x64-windows-static

      - name: Flutter Rust Bridge Codegen
        shell: bash
        run: |
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --locked || cargo install flutter_rust_bridge_codegen --locked
          flutter_rust_bridge_codegen --rust-input ./libs/bridge/src/api.rs --dart-output ./lib/bridge_generated.dart || true

      - name: Patch Configuration
        shell: bash
        run: |
          if [ -f "build.py" ]; then
            python -c "
          with open('build.py', 'r', encoding='utf-8') as f:
              content = f.read()
          content = content.replace('check_status(False)', '# check_status(False)')
          with open('build.py', 'w', encoding='utf-8') as f:
              f.write(content)
          "
          fi

      - name: Run Build Script
        shell: bash
        env:
          VCPKG_ROOT: ${{ env.VCPKG_ROOT }}
          RUST_BACKTRACE: 1
        run: |
          python build.py --release

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beenet-windows-binaries
          path: |
            target/release/*.exe
            target/release/*.dll
            build-full.log

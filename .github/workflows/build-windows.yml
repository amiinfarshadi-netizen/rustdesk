name: BeeNet Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

jobs:
  build:
    name: Build Windows Client
    runs-on: windows-2022

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup MSVC Developer Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          architecture: x64
          cache: false

      - name: Setup vcpkg and Dependencies
        shell: pwsh
        run: |
          $vcpkgDir = if ($env:VCPKG_INSTALLATION_ROOT -and (Test-Path $env:VCPKG_INSTALLATION_ROOT)) {
              $env:VCPKG_INSTALLATION_ROOT
          } elseif (Test-Path "C:\vcpkg") { "C:\vcpkg" } else { throw "vcpkg directory not found." }

          git config --global --add safe.directory $vcpkgDir
          Push-Location $vcpkgDir
          git fetch --all --tags --prune
          git reset --hard origin/master
          & ".\bootstrap-vcpkg.bat" -disableMetrics
          Pop-Location

          & "$vcpkgDir\vcpkg.exe" integrate install

          # نصب وابستگی‌های پایدار FFmpeg (بدون پورت‌های نامعتبر libaom و libyuv)
          & "$vcpkgDir\vcpkg.exe" install ffmpeg[gpl,vpx,x264,opus]:x64-windows-static libvpx:x64-windows-static opus:x64-windows-static --classic --recurse

          $installedRoot = "$vcpkgDir\installed\x64-windows-static"
          "$installedRoot\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "VCPKG_ROOT=$vcpkgDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "FFMPEG_DIR=$installedRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "INCLUDE=$installedRoot\include;$env:INCLUDE" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "LIB=$installedRoot\lib;$env:LIB" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Fetch Cargo Dependencies
        shell: cmd
        run: cargo fetch

      - name: Patch hwcodec for newer FFmpeg
        shell: pwsh
        run: |
          $cargoHome = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { "$env:USERPROFILE\.cargo" }

          $hwcodecFiles = Get-ChildItem -Path "$cargo

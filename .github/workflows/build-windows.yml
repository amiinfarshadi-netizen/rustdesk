name: BeeNet Windows Build

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable

      - name: Flutter Rust Bridge Codegen
        shell: pwsh
        run: |
          cd flutter
          flutter pub get
          cd ..
          cargo install flutter_rust_bridge_codegen --version 1.80.1
          flutter_rust_bridge_codegen --rust-input src/flutter_ffi.rs --dart-output flutter/lib/generated_bridge.dart

      - name: Run Direct Build Execution
        shell: cmd
        env:
          RENDEZVOUS_SERVER: "5.202.90.37"
          RS_PUB_KEY: "urwMFu4fL6ov3jSaG+KZoduD6OdSp3sstm6iwiaWDGw="
          VCPKG_ROOT: "C:\\vcpkg"
          VCPKG_DEFAULT_TRIPLET: "x64-windows-static"
          BINDGEN_EXTRA_CLANG_ARGS: "-IC:/vcpkg/installed/x64-windows-static/include"
          RUST_BACKTRACE: "full"
        run: |
          python -u build.py --flutter --hwcodec --skip-portable-pack

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beenetdesk-windows-binaries
          path: |
            flutter/build/windows/x64/runner/Release/*
            target/release/*.dll
            build-full.log
          if-no-files-found: warn

name: BeeNet Windows Build

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: windows-20 and Codegen
        shell: pwsh
        run: |
          cd flutter
          flutter pub get
          cd ..
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --features "cli" --locked
          flutter_rust_bridge_codegen --rust-input src/flutter_ffi.rs --dart-output flutter/lib/generated_bridge.dart

      - name: Run build.py with Skip Portable Pack
        shell: cmd
        env:
          RENDEZVOUS_SERVER: "5.202.90.37"
          RS_PUB_KEY: "urwMFu4fL6ov3jSaG+KZoduD6OdSp3sstm6iwiaWDGw="
          VCPKG_ROOT: "C:\\vcpkg"
          VCPKG_DEFAULT_TRIPLET: "x64-windows-static"
          BINDGEN_EXTRA_CLANG_ARGS: "-IC:/vcpkg/installed/x64-windows-static/include"
          RUST_BACKTRACE: "full"
        run: |
          python -u build.py --flutter --hwcodec --skip-portable-pack

      - name: Upload Complete Binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beenetdesk-windows-release
          path: |
            flutter/build/windows/x64/runner/Release/*
            target/release/*.dll
            build-*.log
          if-no-files-found: warn

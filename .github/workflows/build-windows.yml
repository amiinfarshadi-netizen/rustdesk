name: BeeNet Windows Build

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Windows Client
    runs-on: windows-2022

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC Developer Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Setup vcpkg and Dependencies
        shell: pwsh
        run: |
          $vcpkgDir = if ($env:VCPKG_INSTALLATION_ROOT -and (Test-Path $env:VCPKG_INSTALLATION_ROOT)) {
              $env:VCPKG_INSTALLATION_ROOT
          } elseif (Test-Path "C:\vcpkg") {
              "C:\vcpkg"
          } else {
              throw "vcpkg directory not found."
          }
          Write-Host "Using vcpkg from: $vcpkgDir"

          # 1. دور زدن محدودیت امنیتی گیت در رانر ویندوز
          git config --global --add safe.directory $vcpkgDir

          # 2. سینک و آپدیت کامل vcpkg برای دریافت پورت‌های libaom و libyuv
          Push-Location $vcpkgDir
          git fetch --all --tags --prune
          git reset --hard origin/master
          & ".\bootstrap-vcpkg.bat" -disableMetrics
          Pop-Location

          # 3. رجیستر کردن پورت‌ها
          & "$vcpkgDir\vcpkg.exe" integrate install

          # 4. نصب وابستگی‌های صوتی/تصویری مورد نیاز scrap و hwcodec
          & "$vcpkgDir\vcpkg.exe" install `
              ffmpeg[gpl,vpx,x264,opus]:x64-windows-static `
              libvpx:x64-windows-static `
              opus:x64-windows-static `
              libaom:x64-windows-static `
              libyuv:x64-windows-static `
              --classic --recurse

          # 5. ست کردن متغیرهای محیطی برای bindgen و Cargo
          $installedRoot = "$vcpkgDir\installed\x64-windows-static"
          echo "$installedRoot\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "VCPKG_ROOT=$vcpkgDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "FFMPEG_DIR=$installedRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "INCLUDE=$installedRoot\include;$env:INCLUDE" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "LIB=$installedRoot\lib;$env:LIB" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Fetch Cargo Dependencies
        shell: pwsh
        run: |
          cargo fetch

      - name: Patch hwcodec for newer FFmpeg
        shell: pwsh
        run: |
          $cargoHome = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { "$env:USERPROFILE\.cargo" }
          $hwcodecDirs = Get-ChildItem -Path "$cargoHome\registry\src" -Recurse -Directory -Filter "hwcodec-*" -ErrorAction SilentlyContinue

          if (-not $hwcodecDirs) {
              Write-Host "hwcodec crate not found in registry yet. Skipping patch step."
              exit 0
          }

          foreach ($dir in $hwcodecDirs) {
              Write-Host "Found hwcodec in: $($dir.FullName)"

              # 1. پچ سازگاری key_frame در فایل‌های cpp
              $cppFiles = Get-ChildItem -Path $dir.FullName -Recurse -Filter "*.cpp"
              foreach ($file in $cppFiles) {
                  $content = Get-Content -Raw -Path $file.FullName
                  if ($content -match "key_frame") {
                      $updated = $content -replace '(?<!flags\s*&\s*AV_PKT_FLAG_KEY)(frame->key_frame\s*==\s*1)', '((frame->flags & AV_PKT_FLAG_KEY) != 0)'
                      if ($updated -ne $content) {
                          Set-Content -Path $file.FullName -Value $updated -NoNewline
                          Write-Host "  -> Patched key_frame in $($file.Name)"
                      }
                  }
              }

              # 2. تزریق ایمن شیم تعاریف پروفایل‌های منسوخ‌شده FFmpeg
              $utilFile = Get-ChildItem -Path $dir.FullName -Recurse -Filter "util.cpp" | Select-Object -First 1
              if ($utilFile) {
                  $utilContent = Get-Content -Raw -Path $utilFile.FullName
                  if (-not ($utilContent -match "SHIM_FF_PROFILES_DEFINED")) {
                      $shim = @"
          #ifndef SHIM_FF_PROFILES_DEFINED
          #define SHIM_FF_PROFILES_DEFINED
          #ifndef FF_PROFILE_H264_HIGH
          #define FF_PROFILE_H264_HIGH 100
          #endif
          #ifndef FF_PROFILE_HEVC_MAIN
          #define FF_PROFILE_HEVC_MAIN 1
          #endif
          #endif
          "@
                      Set-Content -Path $utilFile.FullName -Value ($shim + "`r`n" + $utilContent) -NoNewline
                      Write-Host "  -> FF_PROFILE shim injected into $($utilFile.Name)"
                  }
              }
          }

      - name: Run build.py directly
        shell: pwsh
        env:
          RENDEZVOUS_SERVER: "api.beenet.pro"
          RS_PUB_KEY: "4B1YmE2ZvZ0rA/r9O6UuG0wK6qK1G0fX/1WJt8uT0b8="
          RUST_BACKTRACE: "full"
        run: |
          python -u build.py --flutter --hwcodec

      - name: Upload Binaries
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: beenetdesk-windows-binaries
          path: |
            target/release/*.dll
            target/release/*.exe
            build/windows/runner/Release/*
          retention-days: 7

      - name: Upload Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-logs
          path: |
            build-full.log
            build-stdout.log
            build-stderr.log
            target/release/build/**/*.log
          retention-days: 7

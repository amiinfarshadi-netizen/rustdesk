name: BeeNet Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - master
      libyuv:x64-windows-static `
            opus:x64-windows-static `
            aom:x64-windows-static

      - name: Install LLVM
        shell: powershell
        run: |
          choco install llvm -y

      - name: Add LLVM to PATH
        shell: powershell
        run: |
          echo "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Flutter Rust Bridge Codegen
        shell: powershell
        run: |
          cargo install flutter_rust_bridge_codegen --version 1.80.1

      - name: Flutter Rust Bridge Codegen
        shell: powershell
        run: |
          cd flutter
          flutter pub get
          cd ..
          flutter_rust_bridge_codegen --rust-input src/flutter_ffi.rs --dart-output flutter/lib/generated_bridge.dart

      - name: Run Build Script
        shell: powershell
        run: |
          python build.py --flutter --skip-portable-pack

      - name: Upload Binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beenetdesk-windows-binaries
          path: |
            target/release/*.exe
            target/release/*.dll
            flutter/build/windows/x64/runner/Release/**
          if-no-files-found: ignore

name: BeeNet Windows Build

on:
  workflow_dispatch:
  push:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: "stable"

      - name: Run Build Script
        shell: pwsh
        env:
          RENDEZVOUS_SERVER: "5.202.90.37"
          RS_PUB_KEY: "urwMFu4fL6ov3jSaG+KZoduD6OdSp3sstm6iwiaWDGw="
          RUST_BACKTRACE: "full"
          PYTHONUNBUFFERED: "1"
        run: |
          cmd /c "python build.py --flutter --hwcodec 2>&1" | Tee-Object -FilePath "build-full.log"
          $buildExit = $LASTEXITCODE
          Write-Host "Build finished with exit code: $buildExit"
          if ($buildExit -ne 0) {
              exit $buildExit
          }

      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-and-binaries
          path: |
            build-full.log
            target/release/*.dll
            target/release/*.exe
            flutter/build/windows/x64/runner/Release/*
          if-no-files-found: warn

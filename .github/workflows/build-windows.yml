name: Build Windows Client

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build-windows:
    runs-on: windows-2022

    env:
      VCPKG_ROOT: C:\vcpkg
      RUST_BACKTRACE: 1

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC Developer Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Setup vcpkg and Dependencies
        shell: pwsh
        run: |
          if (-not (Test-Path $env:VCPKG_ROOT)) {
            git clone https://github.com/microsoft/vcpkg $env:VCPKG_ROOT
          }

          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat"

          & "$env:VCPKG_ROOT\vcpkg.exe" install `
            opus `
            libvpx `
            aom `
            --triplet x64-windows

      - name: Install LLVM
        shell: pwsh
        run: |
          choco install llvm -y

      - name: Add LLVM to PATH
        shell: pwsh
        run: |
          "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Flutter Rust Bridge Codegen
        shell: pwsh
        run: |
          cargo install flutter_rust_bridge_codegen

      - name: Flutter Rust Bridge Codegen
        shell: pwsh
        run: |
          flutter pub get
          flutter_rust_bridge_codegen generate

      - name: Run Build Script
        shell: pwsh
        run: |
          python build.py --flutter --hwcodec --vram

      - name: Upload Binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beenet-windows-binaries
          path: |
            target/release/*.exe
            target/release/*.dll
            build/windows/x64/runner/Release/**
          if-no-files-found: warn

      - name: Run Build Script
        shell: pwsh
        env:
          RENDEZVOUS_SERVER: "5.202.90.37"
          RS_PUB_KEY: "urwMFu4fL6ov3jSaG+KZoduD6OdSp3sstm6iwiaWDGw="
          RUST_BACKTRACE: "full"
          CARGO_TERM_COLOR: "always"
        run: |
          Write-Host "=== python version ==="
          python --version

          Write-Host "=== build.py exists? ==="
          Test-Path .\build.py

          Write-Host "=== build.py --help ==="
          python -u .\build.py --help

          Write-Host "=== START REAL BUILD ==="
          $p = Start"
          $p = Start-Process -FilePath "python" -ArgumentList "-u","","--hwcodec" -NoNewWindow -Wait -PassThru -RedirectStandardOutput "build-stdout.log" -RedirectStandardError "build-stderr.log"
          Write-Host "=== exit code: $($p.ExitCode) ==="

          Write-Host "===== STDOUT (last 100 lines) ====="
          if (Test-Path build-stdout.log) { Get-Content build-stdout.log -Tail 100 | ForEach-Object { Write-Host $_ } }
          Write-Host "===== STDERR (last 100 lines) ====="
          if (Test-Path build-stderr.log) { Get-Content build-stderr.log -Tail 100 | ForEach-Object { Write-Host $_ } }

          Get-ChildItem build-*.log | ForEach-Object { Write-Host $_.Name }
          exit $p.ExitCode

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beenet-build-log
          path: |
            build-stdout.log
            build-stderr.log
          if-no-files-found: warn

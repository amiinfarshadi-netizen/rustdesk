name: Build BeeNet Desk Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows Client
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Inspect repository
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "Current directory: $(Get-Location)"
          Write-Host "Files list:"
          Get-ChildItem -Name

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: "stable"
          cache: true

      - name: Install Windows build dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install nasm yasm ninja llvm -y --no-progress
          Write-Host "Tools checked."

      - name: Install Python dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          if (Test-Path "requirements.txt") {
            python -m pip install -r requirements.txt
          }
          python -m pip install requests toml

      - name: Inject BeeNet configuration
        shell: pwsh
        run: |
          $rendezvousServer = "5.202.90.37"
          $rsPubKey = "urwMFu4fL6ov3jSaG+KZoduD6OdSp3sstm6iwiaWDGw="
          "RENDEZVOUS_SERVER=$rendezvousServer" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RS_PUB_KEY=$rsPubKey" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Config injected."

      - name: Run Build Script
        shell: pwsh
        env:
          RENDEZVOUS_SERVER: "5.202.90.37"
          RS_PUB_KEY: "urwMFu4fL6ov3jSaG+KZoduD6OdSp3sstm6iwiaWDGw="
          RUST_BACKTRACE: "full"
          CARGO_TERM_COLOR: "always"
        run: |
          $ErrorActionPreference = "Continue"
          Write-Host "Starting build..."
          python build.py --flutter --hwcodec 2>&1 | Tee-Object -FilePath "build-output.log"
          $code = $LASTEXITCODE
          Write-Host "Exit code: $code"
          if ($code -ne 0) {
            exit $code
          }

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beenet-build-log
          path: build-output.log
          if-no-files-found: ignore

      - name: Upload BeeNet Desk Windows
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BeeNet-Desk-Windows
          path: |
            target/release/*.exe
            build/windows/runner/Release/*.exe
            rustdesk-*.exe
            *.exe
          if-no-files-found: warn

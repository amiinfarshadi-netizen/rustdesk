name: BeeNet Windows Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable

      - name: Setup and Install vcpkg Dependencies
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $vcpkgDir = "$env:VCPKG_INSTALLATION_ROOT"
          if (-not $vcpkgDir -or -not (Test-Path "$vcpkgDir\vcpkg.exe")) {
            $vcpkgDir = "C:\vcpkg"
          }

          if (-not (Test-Path "$vcpkgDir\vcpkg.exe")) {
            throw "vcpkg.exe not found at $vcpkgDir"
          }

          Write-Host "Using VCPKG at: $vcpkgDir"

          & "$vcpkgDir\vcpkg.exe" install --classic `
            libvpx:x64-windows-static `
            libyuv:x64-windows-static `
            opus:x64-windows-static `
            aom:x64-windows-static

          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg install failed with exit code $LASTEXITCODE"
          }

          "VCPKG_ROOT=$vcpkgDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKGRS_DYNAMIC=0" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install LLVM (Clang) for ffigen
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          choco install llvm -y --no-progress

          $llvmBin = "C:\Program Files\LLVM\bin"
          if (-not (Test-Path $llvmBin)) {
            throw "LLVM bin path not found: $llvmBin"
          }

          $llvmBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "LIBCLANG_PATH=$llvmBin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          clang --version
          if ($LASTEXITCODE -ne 0) { throw "clang not available after install" }

      - name: Flutter Rust Bridge Codegen
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          # 1. حل وابستگی پکیج‌های فلاتر و ایجاد package_config.json
          Push-Location flutter
          flutter pub get
          Pop-Location

          # همچنین در ریشه پروژه اگر فایلی وابسته است
          if (Test-Path "pubspec.yaml") {
            flutter pub get
          }

          # 2. فعال‌سازی ابزارها
          dart pub global activate ffigen 5.0.1
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --locked

          # 3. اجرای نهایی کدجن
          flutter_rust_bridge_codegen `
            --rust-input src/flutter_ffi.rs `
            --dart-output flutter/lib/generated_bridge.dart

      - name: Run Build Script
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          python -u build.py --flutter --skip-portable-pack 2>&1 | Tee-Object -FilePath build-full.log
          if ($LASTEXITCODE -ne 0) {
            throw "build.py failed with exit code $LASTEXITCODE"
          }

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build-full.log
            **/*.log

      - name: Upload Binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beenetdesk-windows-binaries
          path: |
            flutter/build/windows/x64/runner/Release/**
            target/release/librustdesk.dll
            target/release/dylib_virtual_display.dll

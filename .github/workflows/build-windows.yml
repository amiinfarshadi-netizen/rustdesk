name: BeeNet Windows Build

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: windows-2022
    steps:
      # ۱. چک‌اوت ریپوزیتوری همراه با بازخوانی کامل ساب‌ماژول‌ها (رفع خطای os error 2)
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # ۲. تنظیم محیط MSVC برای کامپایل C++ / vcpkg
      - name: Setup MSVC Developer Environment
        uses: ilammy/msvc-dev-cmd@v1

      # ۳. تنظیم پایتون
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ۴. تنظیم ابزارهای Rust
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # ۵. تنظیم Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable

      # ۶. دانلود وابستگی‌های Workspace (مرحله ایمنی برای اطمینان از وجود فایل‌های کرت)
      - name: Update Submodules & Fetch Cargo Dependencies
        shell: pwsh
        run: |
          git submodule update --init --recursive
          cargo fetch

      # ۷. اعمال پچ دقیق روی hwcodec برای سازگاری با FFmpeg جدید و کدویجوال استودیو
      - name: Patch hwcodec for newer FFmpeg
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          
          # پیدا کردن مسیر کرت hwcodec در کش cargo
          $checkouts = "$env:USERPROFILE\.cargo\git\checkouts"
          if (-not (Test-Path $checkouts)) {
              Write-Host "!! Cargo checkouts directory not found: $checkouts"
              exit 1
          }

          # ۱. پچ فایل util.cpp برای تعریف ثابت‌های FF_PROFILE (رفع خطاهای C2065/C2039)
          $utilFiles = Get-ChildItem -Path $checkouts -Recurse -Filter "util.cpp" | Where-Path { $_.FullName -like "*hwcodec*" }
          foreach ($f in $utilFiles) {
              Write-Host "Patching FF_PROFILE in: $($f.FullName)"
              $content = Get-Content $f.FullName -Raw
              if ($content -notmatch "FF_PROFILE_HEVC_MAIN_10") {
                  $shim = @"
          #ifndef FF_PROFILE_HEVC_MAIN_10
          #define FF_PROFILE_HEVC_MAIN_10 2
          #endif
          #ifndef FF_PROFILE_HEVC_MAIN
          #define FF_PROFILE_HEVC_MAIN 1
          #endif
          #ifndef FF_PROFILE_AAC_LOW
          #define FF_PROFILE_AAC_LOW 1
          #endif
          "@
                  $content = $shim + "`n" + $content
                  Set-Content -Path $f.FullName -Value $content -NoNewline
                  Write-Host "-> Successfully injected FF_PROFILE defines into util.cpp"
              }
          }

          # ۲. پچ فایل ffmpeg_ram_decode.cpp (جایگزینی key_frame با AV_FRAME_FLAG_KEY)
          $ramFiles = Get-ChildItem -Path $checkouts -Recurse -Filter "ffmpeg_ram_decode.cpp" | Where-Path { $_.FullName -like "*hwcodec*" }
          foreach ($f in $ramFiles) {
              Write-Host "Patching key_frame in: $($f.FullName)"
              $lines = Get-Content $f.FullName
              
              # ثبت وضعیت خط قبل از پچ (Diagnostic LOG)
              $beforeMatches = Select-String -Path $f.FullName -Pattern "key_frame"
              if ($beforeMatches) {
                  Write-Host "BEFORE PATCH MATCHES:"
                  $beforeMatches | ForEach-Object { Write-Host "Line $($_.LineNumber): $($_.Line)" }
              }

              # اعمال تغییر با الگوی Regex مطمئن
              $rawContent = Get-Content $f.FullName -Raw
              $patchedContent = $rawContent -replace '(\w+)->key_frame', '($1->flags & AV_FRAME_FLAG_KEY)'
              Set-Content -Path $f.FullName -Value $patchedContent -NoNewline
              Write-Host "-> Applied key_frame regex patch to ffmpeg_ram_decode.cpp"

              # بررسی وضعیت پس از اعمال پچ
              $afterMatches = Select-String -Path $f.FullName -Pattern "key_frame"
              if ($afterMatches) {
                  Write-Host "REMAINING key_frame OCCURRENCES:"
                  $afterMatches | ForEach-Object { Write-Host "Line $($_.LineNumber): $($_.Line)" }
              } else {
                  Write-Host "-> All key_frame references successfully patched!"
              }
          }

      # ۸. اجرای اسکریپت اصلی بیلد پروژه
      - name: Run build.py directly
        shell: cmd
        env:
          RENDEZVOUS_SERVER: "5.202.90.37"
          RS_PUB_KEY: "urwMFu4fL6ov3jSaG+KZoduD6OdSp3sstm6iwiaWDGw="
          RUST_BACKTRACE: "full"
        run: |
          python -u build.py --flutter --hwcodec
          echo EXITCODE=%ERRORLEVEL%
          exit %ERRORLEVEL%

      # ۹. آپلود فایل‌های اجرایی تولیدشده (خروجی موفقیت‌آمیز)
      - name: Upload Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: beenetdesk-windows-binaries
          path: |
            target/release/*.dll
            target/release/*.exe
            build/windows/runner/Release/*
          if-no-files-found: ignore

      # ۱۰. آپلود لاگ‌ها در صورت بروز خطا (دیباگ فوری)
      - name: Upload Logs on Failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beenet-build-logs
          path: |
            build-full.log
            build-stdout.log
            build-stderr.log
          if-no-files-found: ignore

name: BeeNet Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Setup LLVM / Clang (for bindgen)
        run: |
          choco install llvm -y --no-progress
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Setup vcpkg and C/C++ Dependencies
        shell: pwsh
        run: |
          $vcpkgDir = "C:\vcpkg"
          if (-not (Test-Path "$vcpkgDir\vcpkg.exe")) {
            Write-Host "Cloning vcpkg..."
            git clone https://github.com/microsoft/vcpkg.git $vcpkgDir
            & "$vcpkgDir\bootstrap-vcpkg.bat" -disableMetrics
          }

          Write-Host "Installing dependencies via vcpkg..."
          & "$vcpkgDir\vcpkg.exe" install `
            ffmpeg[gpl,vpx,x264,opus]:x64-windows-static `
            libvpx:x64-windows-static `
            opus:x64-windows-static `
            aom:x64-windows-static `
            libyuv:x64-windows-static `
            onevpl:x64-windows-static `
            --classic --recurse

          $installedRoot = "$vcpkgDir\installed\x64-windows-static"
          $libPath = "$installedRoot\lib"
          $incPath = "$installedRoot\include"

          # ایجاد آلیاس mfx.lib از onevpl برای رفع خطای لینکر در hwcodec
          if (Test-Path "$libPath\vpl.lib") {
            Copy-Item "$libPath\vpl.lib" "$libPath\mfx.lib" -Force
            Copy-Item "$libPath\vpl.lib" "$libPath\libmfx.lib" -Force
            Write-Host "Created mfx.lib and libmfx.lib aliases from vpl.lib successfully."
          }

          # تنظیم متغیرهای محیطی برای کامپایلر، بایندژن و کارگو
          "FFMPEG_DIR=$installedRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VCPKG_ROOT=$vcpkgDir" | Out-File -FilePath $env:GITHUB_ENV -Append
          "INCLUDE=$incPath;$env:INCLUDE" | Out-File -FilePath $env:GITHUB_ENV -Append
          "LIB=$libPath;$env:LIB" | Out-File -FilePath $env:GITHUB_ENV -Append
          "BINDGEN_EXTRA_CLANG_ARGS=-I$incPath" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Inspect Workspace Environment
        shell: pwsh
        run: |
          Write-Host "=== Git Status & Root Directory ==="
          Get-ChildItem -Force | Select-Object Name
          Write-Host "=== Rust / Cargo Version ==="
          cargo --version
          rustc --version
          Write-Host "=== Flutter Version ==="
          flutter --version

      - name: Run BeeNet Build Script
        shell: cmd
        env:
          RENDEZVOUS_SERVER: "5.202.90.37"
          RS_PUB_KEY: "urwMFu4fL6ov3jSaG+KZoduD6OdSp3sstm6iwiaWDGw="
          RUST_BACKTRACE: "full"
        run: |
          python -u build.py --flutter --hwcodec
          echo EXITCODE=%ERRORLEVEL%
          exit %ERRORLEVEL%

      - name: Upload Build Artifacts (Binaries)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: beenet-windows-binaries
          path: |
            target/release/*.exe
            build/windows/runner/Release/*
          if-no-files-found: ignore

      - name: Upload Build Logs on Failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beenet-build-logs
          path: |
            build-full.log
            build-stdout.log
            build-stderr.log
          if-no-files-found: ignore

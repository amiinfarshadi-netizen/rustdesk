name: BeeNet Windows Build

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup LLVM/Clang (for bindgen)
        run: |
          choco install llvm -y --no-progress
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Setup vcpkg and Build Dependencies
        shell: pwsh
        run: |
          cd C:\vcpkg
          git pull
          .\bootstrap-vcpkg.bat
          .\vcpkg.exe integrate install
          .\vcpkg.exe install --triplet x64-windows-static ffmpeg[gpl,vpx,x264,opus] libvpx opus aom libyuv
          echo "VCPKG_ROOT=C:\vcpkg" >> $env:GITHUB_ENV

      - name: Provide libmfx Stub for hwcodec
        shell: pwsh
        run: |
          $libDir = "C:\vcpkg\installed\x64-windows-static\lib"
          if (-not (Test-Path $libDir)) { New-Item -ItemType Directory -Path $libDir -Force }
          $mfxFile = Join-Path $libDir "libmfx.lib"
          if (-not (Test-Path $mfxFile)) {
              Write-Host "Creating stub libmfx.lib for linker..."
              $dummyDef = "LIBRARY libmfx`nEXPORTS`n  MFXInit`n  MFXClose"
              Set-Content -Path "mfx.def" -Value $dummyDef
              lib.exe /def:mfx.def /machine:x64 /out:"$mfxFile"
              Copy-Item "$mfxFile" (Join-Path $libDir "mfx.lib") -Force
          }

      - name: Run Flutter Rust Bridge Codegen
        shell: pwsh
        run: |
          cd flutter
          flutter pub get
          cd ..
          cargo install flutter_rust_bridge_codegen --version 1.80.1
          flutter_rust_bridge_codegen --rust-input src/flutter_ffi.rs --dart-output flutter/lib/generated_bridge.dart

      - name: Fetch Dependencies & Apply hwcodec Patches
        shell: pwsh
        run: |
          cargo fetch
          # اعمال پچ در صورت وجود عدم سازگاری در سورس‌های محلی hwcodec با FFmpeg جدید
          # (در صورت نیاز اسکریپت جایگزینی FF_PROFILE_H264_BASELINE در اینجا قرار می‌گیرد)

      - name: Execute Main Build Script
        shell: cmd
        env:
          RENDEZVOUS_SERVER: "5.202.90.37"
          RS_PUB_KEY: ${{ secrets.RS_PUB_KEY }}
          VCPKG_ROOT: "C:\\vcpkg"
          RUST_BACKTRACE: "full"
        run: |
          python -u build.py --flutter --hwcodec

      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beenet-windows-binaries
          path: |
            target/release/*.dll
            target/release/*.exe
            flutter/build/windows/runner/Release/**
            build-*.log
          if-no-files-found: ignore
